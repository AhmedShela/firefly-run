<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0b1220">
  <title>Firefly Run</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;700&display=swap">
  <style>
    /* Layout: one full-screen canvas, a slim HUD bar on top, a centered card overlay for start / game over. Single dark "rainy night" look by design. */
    :root {
      --night: #0b1220;
      --night-2: #131d33;
      --ink: #e8eefc;
      --muted: #8a9bc4;
      --glow: #ffd45c;
      --rain: #7fb4ff;
      --display: 'Bungee', 'Arial Black', Impact, sans-serif;
      --body: 'Chakra Petch', ui-sans-serif, system-ui, sans-serif;
      color-scheme: dark;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box
    }

    /* The JS shows/hides the HUD and cards with el.hidden; without this, .hud's
       display:flex and .overlay's display:grid would override the hidden attribute. */
    [hidden] {
      display: none !important
    }

    html,
    body {
      height: 100%;
      margin: 0
    }

    body {
      background: var(--night);
      color: var(--ink);
      font-family: var(--body);
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent
    }

    #game {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block
    }

    .hud {
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 8px;
      pointer-events: none;
      font-variant-numeric: tabular-nums
    }

    .hud .lbl {
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted)
    }

    .hud .val {
      font-family: var(--display);
      font-size: 26px;
      line-height: 1;
      color: var(--glow)
    }

    .hud .right {
      text-align: right
    }

    .hud .right .val {
      color: var(--ink);
      font-size: 18px
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding-inline: 16px
    }

    .card {
      width: min(360px, 100%);
      background: color-mix(in srgb, var(--night-2) 88%, transparent);
      border: 1px solid color-mix(in srgb, var(--rain) 25%, transparent);
      border-radius: 18px;
      padding: 28px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: center;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px)
    }

    h1 {
      font-family: var(--display);
      font-weight: 400;
      font-size: clamp(34px, 11vw, 48px);
      line-height: .95;
      margin: 0;
      color: var(--glow);
      text-shadow: 0 0 24px color-mix(in srgb, var(--glow) 55%, transparent);
      text-wrap: balance
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5
    }

    .card p b {
      color: var(--ink);
      font-weight: 700
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 28px;
      font-variant-numeric: tabular-nums
    }

    .stats div {
      display: flex;
      flex-direction: column;
      gap: 2px
    }

    .stats span {
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted)
    }

    .stats strong {
      font-family: var(--display);
      font-weight: 400;
      font-size: 28px;
      color: var(--ink)
    }

    .stats .new {
      color: var(--glow)
    }

    button {
      font-family: var(--display);
      font-size: 20px;
      letter-spacing: .04em;
      border: 0;
      border-radius: 999px;
      padding: 14px 22px;
      background: var(--glow);
      color: var(--night);
      cursor: pointer;
      box-shadow: 0 0 0 0 var(--glow);
      transition: transform .12s, box-shadow .2s
    }

    button:hover {
      box-shadow: 0 0 22px -2px var(--glow)
    }

    button:active {
      transform: scale(.97)
    }

    button:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 3px
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: .06em
    }
  </style>
</head>

<body>

  <canvas id="game" aria-label="Firefly Run game area"></canvas>

  <div class="hud" id="hud" hidden>
    <div>
      <div class="lbl">Score</div>
      <div class="val" id="score">0</div>
    </div>
    <div class="right">
      <div class="lbl">Best</div>
      <div class="val" id="bestHud">0</div>
    </div>
  </div>

  <div class="overlay" id="startScreen">
    <div class="card">
      <h1>Firefly Run</h1>
      <p>Keep your firefly dry. <b>Drag anywhere</b> to steer, dodge the raindrops, and grab pollen for <b>+25</b>.</p>
      <div class="stats">
        <div><span>Best</span><strong id="bestStart">0</strong></div>
      </div>
      <button id="playBtn" type="button">Play</button>
      <div class="hint">On a keyboard: ← → or A / D</div>
    </div>
  </div>

  <div class="overlay" id="overScreen" hidden>
    <div class="card">
      <h1 id="overTitle">Doused!</h1>
      <div class="stats">
        <div><span>Score</span><strong id="finalScore">0</strong></div>
        <div><span>Best</span><strong id="finalBest">0</strong></div>
      </div>
      <p id="overNote">The rain gets heavier the longer you last.</p>
      <button id="againBtn" type="button">Fly again</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>

</html>
